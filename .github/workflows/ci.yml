name: CI

# Tier 1 of the two-tier plan (TECH_DEBT X1): everything that can run WITHOUT
# the ~340 MB fixture corpus, on every PR and push. The corpus lives outside
# this repo, so the fixture-driven tests in tests/ skip themselves rather than
# fail — see the note in release.yml. Tier 2 (full corpus + rs↔py parity) needs
# a published corpus artefact and is not wired up yet.
#
# Why this matters: the fixture tests skipping is exactly the "silently skips
# rather than fails" hazard CLAUDE.md §1 warns about, so this workflow asserts
# that the corpus-less suite is genuinely green rather than genuinely absent.

on:
  pull_request:
  push:
    branches: [main, master, trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Gating. The tree was reformatted wholesale in its own commit (838 diff
      # hunks) so this starts green and stays green — the only way a format
      # check is worth having.
      - name: Formatting
        run: cargo fmt --all -- --check

      # Gating, and `-D warnings` so a new finding fails rather than scrolls
      # past. The 142 findings this started with are gone: 82 `type_complexity`
      # went away behind the `ExtractedImages` / `ChunksWithImages` aliases in
      # `chunk.rs`, ~48 were mechanical (`clippy --fix`), and the 6 remaining
      # `too_many_arguments` carry an `#[allow]` with the reason in place —
      # they mirror the public cross-SDK signature and cannot be regrouped
      # unilaterally.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit + doc tests
        # `--lib` + `--doc` only. The fixture corpus (~280 MB) is
        # workspace-private and deliberately not in this repo, and the
        # corpus-driven integration tests PANIC rather than skip when a fixture
        # is missing — a test that quietly passes without its corpus pins
        # nothing. Running them here would fail every bare clone (caught by
        # CI's first-ever run). The two integration suites below are the
        # CI-safe ones: they carry an explicit corpus-absent skip. The full
        # integration gate runs in the workspace, where the corpus lives.
        run: |
          cargo test --all-features --lib
          cargo test --all-features --doc

      - name: Adversarial inputs must fail cleanly, never panic
        run: cargo test --all-features --test adversarial_inputs

      - name: Hostile .xls must not exhaust memory (TECH_DEBT T12)
        # This one is load-bearing: the bug it guards took the whole process
        # down via the OOM killer, which no `catch_unwind` can intercept. If it
        # ever kills the runner instead of failing, that IS the regression.
        run: cargo test --all-features --test xls_allocation_bound

  wasm:
    name: wasm32 builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # js-chunks compiles this crate to wasm; PDF page rasterisation is native
      # only, so the wasm build must drop default features.
      - name: Build for wasm32 (no default features)
        run: cargo build --release --target wasm32-unknown-unknown --no-default-features
