name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # OIDC Trusted Publishing (no CARGO_REGISTRY_TOKEN secret): crates-io-auth-action
    # exchanges a short-lived GitHub OIDC token for a one-shot crates.io publish
    # token, used only for this job and auto-revoked after. Requires a Trusted
    # Publisher already configured on crates.io for this repo/workflow.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (verify it compiles, native + wasm)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release
          cargo build --release --target wasm32-unknown-unknown --no-default-features

      # The fixture corpus (../test_files) lives outside this repo, so the
      # fixture-driven integration tests in tests/ cannot run on CI (they fail
      # loudly on a missing corpus by design). What runs here instead:
      #   1. every inline #[cfg(test)] unit test (--lib), and
      #   2. tests/adversarial_inputs.rs, which synthesises corrupt inputs
      #      in-memory and needs no fixtures (panic-boundary + malformed-MIME
      #      coverage).
      # The full fixture suite runs locally via plain `cargo test`.
      - name: Test
        run: |
          cargo test --release --lib
          cargo test --release --test adversarial_inputs

      - name: Get crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
