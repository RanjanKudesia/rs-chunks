[package]
# Published to crates.io as `rs-chunks` (the name `chunks-rs` was already taken).
# The library import name stays `chunks_rs` (see [lib]), so downstream `use
# chunks_rs::...` is unaffected.
name = "rs-chunks"
version = "0.6.3"
edition = "2021"
description = "Fast, high-fidelity document chunking for RAG — a pure-Rust engine covering 36 file formats (Office, OpenDocument, PDF, email, ebooks, notebooks, and more)."
authors = ["Ranjan Kudesia <ranjan.kudesia@gmail.com>"]
license = "MIT"
repository = "https://github.com/RanjanKudesia/rs-chunks"
homepage = "https://github.com/RanjanKudesia/rs-chunks"
documentation = "https://docs.rs/rs-chunks"
readme = "README.md"
keywords = ["chunking", "document", "rag", "pdf", "docx"]
categories = ["text-processing", "parsing"]
# Keep the published crate lean: the parity harnesses in examples/ and the
# integration tests reference fixtures outside the crate (../test_files) and are
# development-only.
exclude = ["/examples", "/tests", "/target", "/.github"]

[lib]
name = "chunks_rs"

[features]
# PDF *parsing* is pure Rust, always compiled in, and builds for wasm32.
# `pdf-native` (ON by default) adds only page rasterisation via the liteparse
# crate (PDFium) — the fallback used when a scanned PDF has no embedded page
# image to return. Disable default features for wasm32 builds; text-less PDFs
# then report "no text" instead of returning page renders.
default = ["pdf-native"]
pdf-native = ["dep:liteparse", "dep:tokio"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps object members in document order instead of
# alphabetising them through a BTreeMap. Without it `{"name":"Andy","age":30}`
# rendered as `age: 30` then `name: Andy`, which scrambles the causal order of
# every log record in a .jsonl/.ndjson file and reorders every .json object.
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1"
encoding_rs = "0.8"
# Firefox's legacy-web charset detector, by the encoding_rs author. Replaces a
# blanket cp1252 fallback that silently mis-decoded every non-UTF-8, non-UTF-16
# document (measured: a windows-1251 page returned 0 Cyrillic, 927 mojibake runs).
chardetng = "1"
quick-xml = "0.38"
# deflate-only: Office/ODF/epub ZIPs use deflate/store; dropping bzip2/zstd/lzma
# keeps the dependency C-free so it compiles to wasm32.
zip = { version = "2", default-features = false, features = ["deflate"] }
calamine = { version = "0.35", features = ["dates"] }
cfb = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
liteparse = { version = "=2.9.0", default-features = false, optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
mail-parser = { version = "0.11", default-features = false, features = ["full_encoding"] }
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
weezl = "0.2.1"
flate2 = "1.1.9"

[dev-dependencies]
# For building crafted .msg specimens in tests (same crate the reader uses).
cfb = "0.10"
